## Validation Steps

> These steps reflect the actual remediation surface for a Microsoft Exchange Online SaaS vulnerability. Analyst must confirm exact Microsoft guidance via [2] as advisory content was not parseable.

1. **Confirm Microsoft service patch status:**
   - Monitor the Microsoft 365 Service Health Dashboard (admin.microsoft.com → Health → Service health) for Exchange Online incident closure notices referencing CVE-2026-56191.
   - Check the MSRC advisory [2] for patch availability and deployment confirmation notices.

2. **Verify tenant authentication posture (interim mitigation):**
   - In the Microsoft Entra admin center, confirm that Conditional Access policies enforce MFA for all Exchange Online access.
   - Review sign-in logs (Entra ID → Monitoring → Sign-in logs) for anomalous authentication events against Exchange Online in the 5-day window since vulnerability disclosure.

3. **Review Exchange Online audit logs:**
   - Use the Microsoft Purview compliance portal or PowerShell (`Search-UnifiedAuditLog`) to identify any data tampering events consistent with broken authentication abuse.
   - Flag and escalate any unauthorized mailbox access or mail flow rule changes.

4. **Validate no public PoC has emerged:**
   - Re-check threat intelligence feeds at patch time; no public PoC was known at time of writing, but status should be re-verified given the 5-day age and CVSS 10.0 score [1].

5. **If an on-premises Exchange component is separately in scope:**
   - Confirm applied Cumulative Update (CU) or Security Update (SU) version via the Exchange Admin Center or `Get-ExchangeDiagnosticInfo` PowerShell cmdlet.
   - Compare against the fixed version published at [2] once the advisory renders correctly.

